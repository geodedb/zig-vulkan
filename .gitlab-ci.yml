include:
  # Zig testing (requires Zig 0.15.x and vulkan runners)
  - component: gitlab.com/devnw/ci-catalog/zig-test@main
    inputs:
      stage: test
      zig_version: '0.15.2'
      tags:
        - gpu
        - vulkan

  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@main
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@main
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@main
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@main

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@main
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@main
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@main
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - test
  - security
  - sbom
  - release

